include: /etc/knot/keys.conf

server:
    rundir: "/run/knot"
    user: knot:knot
    listen: [ 0.0.0.0@53, ::@53 ]

log:
  - target: syslog
    any: info

database:
    storage: "/var/lib/knot"

policy:
  - id: ed25519
    algorithm: ed25519
    zsk-lifetime: 30d
    ksk-lifetime: 0
    nsec3: on
    nsec3-iterations: 0
    nsec3-salt-length: 0

acl: ; added for irc
  - id: acme_acl
    key: certbot-key
    address: [ 127.0.0.1, ::1 ]
    action: update
    update-type: [ TXT ]
    update-owner: name
    update-owner-name: [ _acme-challenge.irc.toprakkilic.com. ]

zone:
  - domain: toprakkilic.com
    storage: "/var/lib/knot/zones"
    file: toprakkilic.com.zone
    dnssec-signing: on
    dnssec-policy: ed25519
    zonefile-load: difference-no-serial
    zonefile-sync: -1
    journal-content: all
    serial-policy: dateserial
    semantic-checks: on
    acl: [ acme_acl ] ; added for irc